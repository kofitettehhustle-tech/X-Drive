<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Customer signup - X-Drive</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components-rebuilt.css">
    <link rel="stylesheet" href="css/ocean-editorial-theme.css">
    <style>
        body {
            background: linear-gradient(180deg, rgba(14, 20, 26, 0.94), rgba(17, 24, 35, 0.98));
        }
        .auth-shell {
            max-width: 560px;
            margin: 7rem auto 3rem;
            padding: clamp(1.5rem, 4vw, 2.5rem);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0,0,0,0.22);
        }
        .auth-header {
            margin-bottom: 1.25rem;
        }
        .auth-subtitle {
            color: var(--color-text-muted);
            margin-top: .5rem;
        }
        .auth-form {
            display: grid;
            gap: 1rem;
        }
        .auth-actions {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            align-items: center;
        }
        .auth-status {
            min-height: 1.5rem;
            margin: .25rem 0 0;
            color: var(--color-text-muted);
        }
        .auth-status[aria-invalid="true"] {
            color: #ffaba8;
        }
        .muted-link {
            color: var(--color-accent);
            text-decoration: none;
        }
        .muted-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 640px) {
            .auth-shell { margin: 5rem 1rem 2rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="auth-shell" aria-labelledby="signup-title">
            <header class="auth-header">
                <a href="index.html" class="logo" aria-label="X-Drive home"><span class="logo-mark" aria-hidden="true">X</span><span class="logo-name"> Drive</span></a>
                <h1 id="signup-title" style="margin-top:1rem">Create customer account</h1>
                <p class="auth-subtitle">Create a customer account to complete checkout, view orders, and access wallet activity.</p>
            </header>

            <form id="signup-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="signup-email">Email address</label>
                    <input class="form-control" id="signup-email" type="email" inputmode="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <input class="form-control" id="signup-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </div>

                <div class="auth-actions">
                    <button class="btn btn-primary" type="submit">Create account</button>
                    <a class="muted-link" href="login.html">Already have an account?</a>
                </div>

                <p id="signup-status" class="auth-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api-config.js"></script>
    <script src="js/api-client.js"></script>
    <script>
        (() => {
            const form = document.getElementById('signup-form');
            const emailInput = document.getElementById('signup-email');
            const passwordInput = document.getElementById('signup-password');
            const statusNode = document.getElementById('signup-status');

            function setStatus(message, isError = false) {
                statusNode.textContent = message;
                statusNode.setAttribute('aria-invalid', String(isError));
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!form.reportValidity()) return;

                const email = emailInput.value.trim();
                const password = passwordInput.value;
                if (password.length < 12) {
                    setStatus('Choose a password with at least 12 characters.', true);
                    return;
                }

                form.querySelector('button[type="submit"]').disabled = true;
                setStatus('Creating your customer account…');

                try {
                    const result = await window.xdriveAPI.register(email, password);
                    const customer = result?.customer || window.xdriveAPI.customer;
                    if (customer?.email) {
                        setStatus(`Account created for ${customer.email}. Redirecting to your orders…`);
                        window.setTimeout(() => {
                            window.location.href = 'customer-dashboard/orders.html';
                        }, 500);
                        return;
                    }
                    setStatus('Account created, but the session details were not returned. Please sign in again.', true);
                } catch (error) {
                    setStatus(error.message || 'Unable to create the account right now.', true);
                } finally {
                    form.querySelector('button[type="submit"]').disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
